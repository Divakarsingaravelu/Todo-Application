<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="date" id="date"></p>
      <h1>Todos</h1>
    </div>
    <div class="head-right">
      <div class="ring" aria-label="Progress">
        <svg width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="bar" id="bar" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93"/></svg>
        <span id="pct">0%</span>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="composer">
    <input id="input" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="200" aria-label="New task">
    <button class="add" id="add">Add task</button>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-f="all" aria-selected="true">All<small id="c-all">0</small></button>
    <button class="tab" role="tab" data-f="active" aria-selected="false">Active<small id="c-active">0</small></button>
    <button class="tab" role="tab" data-f="done" aria-selected="false">Done<small id="c-done">0</small></button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <footer>
    <span id="left"></span>
    <button class="clear" id="clear" hidden>Clear completed</button>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
